# Optional Render Blueprint. A persistent disk requires a paid service; this
# template deliberately uses the free plan and does not provision paid resources.
services:
  - type: web
    name: urban-design-3d-city-dashboard
    runtime: docker
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    envVars:
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
# Free instance filesystems are ephemeral. Use a persistent volume/host for
# durable SQLite projects; see README before using this for ongoing analyses.
